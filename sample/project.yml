name: OctetV1Toy
options:
  bundleIdPrefix: com.octetproof
  # OctetSDK itself supports iOS 16+. The demo bumps to iOS 17 to use
  # the modern SwiftUI Map API (region-binding overloads were deprecated
  # in 17). Your own host app can target iOS 16 if it doesn't use Map.
  deploymentTarget:
    iOS: "17.0"

# The sample consumes the binary OctetSDK target from this dist repo
# via a local SwiftPM path dependency. Cloning this repo at a tag and
# building the sample then transparently uses that tag's xcframework
# asset (URL pinned in the parent Package.swift). No GitHub auth needed
# for SwiftPM resolution — only the xcframework asset download itself.
packages:
  OctetSDK:
    path: ..

targets:
  OctetV1Toy:
    type: application
    platform: iOS
    sources:
      - .
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "OctetV1Toy needs your location to demo the OctetSDK predicate API."
        NSMotionUsageDescription: "OctetV1Toy uses motion data to detect when you're stationary or moving, which improves the confidence of location proofs."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octetproof.toy.v1
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: OctetSDK
        product: OctetSDK

schemes:
  OctetV1Toy:
    build:
      targets:
        OctetV1Toy: all
    run:
      config: Debug
