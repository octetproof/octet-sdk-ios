name: OctetSample
options:
  bundleIdPrefix: com.octetproof
  # OctetSDK itself supports iOS 16+. The demo bumps to iOS 17 to use
  # the modern SwiftUI Map API (region-binding overloads were deprecated
  # in 17). Your own host app can target iOS 16 if it doesn't use Map.
  deploymentTarget:
    iOS: "17.0"

# The sample consumes the binary OctetSDK target from this dist repo
# via a local SwiftPM path dependency. Cloning this repo at a tag and
# building the sample then transparently uses that tag's xcframework
# asset (URL pinned in the parent Package.swift). No GitHub auth needed
# for SwiftPM resolution — only the xcframework asset download itself.
packages:
  OctetSDK:
    path: ..

targets:
  OctetSample:
    type: application
    platform: iOS
    sources:
      - .
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # These usage strings must stay in lockstep with Info.plist
        # (xcodegen overwrites Info.plist from here if
        # GENERATE_INFOPLIST_FILE is ever flipped to YES). Keep both
        # in neutral, end-user-appropriate copy.
        NSLocationWhenInUseUsageDescription: "This sample uses your location to demonstrate the Octet predicate API."
        NSMotionUsageDescription: "This sample uses motion data to demonstrate how movement improves location-proof confidence."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octetproof.sample
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: OctetSDK
        product: OctetSDK

schemes:
  OctetSample:
    build:
      targets:
        OctetSample: all
    run:
      config: Debug
