# OctetSample: the Octet SDK demo app.
#
# The sample consumes the binary OctetSDK target from this repo via a local
# SwiftPM path dependency. Cloning this repo at a tag and building the sample
# then transparently uses that tag's xcframework asset (URL pinned in the
# parent Package.swift). No GitHub auth needed for SwiftPM resolution, only
# the xcframework asset download itself.
#
# OctetSDK itself supports iOS 16+. The demo bumps to iOS 17 to use the modern
# SwiftUI Map API. Your own host app can target iOS 16 if it doesn't use Map.
#
# Generated at release time; edit the source spec, not this file.

name: OctetSample
options:
  bundleIdPrefix: com.octetproof
  deploymentTarget:
    iOS: '17.0'
packages:
  OctetSDK:
    path: ..
schemes:
  OctetSample:
    build:
      targets:
        OctetSample: all
    run:
      config: Debug
targets:
  OctetSample:
    dependencies:
    - package: OctetSDK
      product: OctetSDK
    info:
      path: Info.plist
      properties:
        CFBundleDocumentTypes:
        - CFBundleTypeName: Octet proof
          LSHandlerRank: Owner
          LSItemContentTypes:
          - com.octetproof.proof
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        NSLocationWhenInUseUsageDescription: This sample uses your location to demonstrate
          the Octet predicate API.
        NSMotionUsageDescription: This sample uses motion data to demonstrate how
          movement improves location-proof confidence.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        UTExportedTypeDeclarations:
        - UTTypeConformsTo:
          - public.json
          UTTypeDescription: Octet proof
          UTTypeIdentifier: com.octetproof.proof
          UTTypeTagSpecification:
            public.filename-extension:
            - octetproof
    platform: iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: OctetSample.entitlements
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: com.octetproof.sample
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1'
      configs:
        Debug:
          APP_ATTEST_ENVIRONMENT: development
        Release:
          APP_ATTEST_ENVIRONMENT: production
    sources:
    - excludes:
      - build
      - '**/*.md'
      - LocalConfig.swift.example
      - web
      path: .
    - path: web
      type: folder
    type: application

